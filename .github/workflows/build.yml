name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Intel PresentMon (MIT) for FPS measurement, embedded into the exe.
      - name: Get PresentMon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRESENTMON_TAG: v2.6.0
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          $assets = gh release view $env:PRESENTMON_TAG --repo GameTechDev/PresentMon --json assets --jq '.assets[].name'
          $assets
          $name = $assets | Where-Object { $_ -match '^PresentMon-[\d\.]+-x64\.exe$' } | Select-Object -First 1
          if (-not $name) { throw "PresentMon console exe not found in $env:PRESENTMON_TAG" }
          gh release download $env:PRESENTMON_TAG --repo GameTechDev/PresentMon --pattern $name --dir src-tauri/bin
          Move-Item "src-tauri/bin/$name" src-tauri/bin/PresentMon.exe -Force
          $sig = Get-AuthenticodeSignature src-tauri/bin/PresentMon.exe
          "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Intel') { throw "PresentMon is not signed by Intel" }
          (Get-FileHash src-tauri/bin/PresentMon.exe -Algorithm SHA256).Hash

      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      - name: Build app + installer
        run: npx -y @tauri-apps/cli@2 build

      - name: Size check
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/whatsinside.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "| Súbor | Veľkosť |`n|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| whatsinside.exe | {0:N1} MB |" -f ($exe.Length / 1MB) | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| $($setup.Name) | {0:N1} MB |" -f ($setup.Length / 1MB) | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Every push: downloadable from the Actions run page.
      - uses: actions/upload-artifact@v4
        with:
          name: whatsinside-windows-x64
          path: |
            src-tauri/target/release/whatsinside.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Tags like v0.4.0: latest.json for the in-app updater (version,
      # installer URL, SHA-256) and the release notes from notes/<tag>.md.
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $ver) { throw "Tag $tag nesedí s verziou v tauri.conf.json ($conf)" }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $notesFile = "notes/$tag.md"
          $notes = if (Test-Path $notesFile) { Get-Content $notesFile -Raw -Encoding utf8 } else { "" }
          if (-not (Test-Path $notesFile)) { New-Item -ItemType Directory -Force notes | Out-Null; Set-Content $notesFile "" }
          [ordered]@{
            version = $ver
            url     = "https://github.com/${{ github.repository }}/releases/download/$tag/$($setup.Name)"
            sha256  = $hash
            notes   = $notes
          } | ConvertTo-Json | Out-File latest.json -Encoding utf8NoBOM
          Get-Content latest.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes/${{ github.ref_name }}.md
          files: |
            src-tauri/target/release/whatsinside.exe
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
