name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      - name: Build app + installer
        run: npx -y @tauri-apps/cli@2 build

      - name: Size check
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/whatsinside.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "| Súbor | Veľkosť |`n|---|---|" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| whatsinside.exe | {0:N1} MB |" -f ($exe.Length / 1MB) | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "| $($setup.Name) | {0:N1} MB |" -f ($setup.Length / 1MB) | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Every push: downloadable from the Actions run page.
      - uses: actions/upload-artifact@v4
        with:
          name: whatsinside-windows-x64
          path: |
            src-tauri/target/release/whatsinside.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Tags like v0.2.0: a GitHub Release with the portable exe and the installer.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/whatsinside.exe
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
