[package]
name = "whatsinside"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Lightweight hardware/RGB utility for Windows (WheresTheApp family). v0.1 is read-only: it detects devices and conflicting vendor apps, it never writes to hardware."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Pure-Rust Windows HID backend: no C toolchain needed, nothing to install.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
