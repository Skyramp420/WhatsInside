[package]
name = "whatsinside"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-only"
description = "WhatsInside – ľahký prehľad o tom, čo je v tvojom PC (od WheresTheApp)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[target.'cfg(windows)'.dependencies]
# Pure-Rust Windows HID backend: no C toolchain needed.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# Set by `tauri build`: serve the UI from the binary instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
